<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Подключение шрифтов без cross-origin блокировок -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet" />
    
    <!-- Подключение стилей -->
    <link rel="stylesheet" href="./style.css" type="text/css" />
    <title>InfoPanel</title>
  </head>
  <body>
    <div class="container">
      <div class="wrap">
        <!-- Валюта -->
        <div class="currency">
          <div class="currency-widget" id="currency-widget">
            <div class="currency-row">
              <div class="currency-name">
                <span class="flag">
                  <img src="https://flagcdn.com/20x15/us.png" width="20" height="15" alt="USD" />
                </span>USD
              </div>
              <div class="rate" id="usd">—</div>
            </div>
            <div class="currency-row">
              <div class="currency-name">
                <span class="flag">
                  <img src="https://flagcdn.com/20x15/eu.png" width="20" height="15" alt="EUR" />
                </span>EUR
              </div>
              <div class="rate" id="eur">—</div>
            </div>
            <div class="currency-row">
              <div class="currency-name">
                <span class="flag">
                  <img src="https://flagcdn.com/20x15/ru.png" width="20" height="15" alt="RUB" />
                </span>RUB
              </div>
              <div class="rate" id="rub">—</div>
            </div>
          </div>
        </div>
        
        <!-- Название -->
        <h1 class="header_title">SAT<span>&#x2022;</span>TOWER</h1>
        
        <!-- Часы -->
        <div id="id_clock"></div>
      </div>
    </div>

    <div class="main-container">
      <!-- Список арендаторов -->
      <div class="tenant-slider-container">
        <div class="loader">Загрузка данных арендаторов...</div>
        <div class="slider-track"></div>
        <div class="slider-nav"></div>
      </div>
    </div>

    <!-- Погода -->
    <div class="weather">
      <a
        class="weatherwidget-io"
        href="https://forecast7.com/ru/51d1671d47/astana/"
        data-label_1="АСТАНА"
        data-label_2="ПОГОДА"
        data-days="3"
        data-theme="marine"
        data-icons="Climacons Animated"
      >ASTANA WEATHER</a>
      <script>
        !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
      </script>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
